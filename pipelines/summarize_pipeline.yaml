name: summarize_with_bedrock
description: Summarize text from an input source using Bedrock.
steps:
  - handler: LocalFileReaderHandler
    config:
      input_key: path

  - handler: PromptHandler
    config:
      prompt_key: prompt_file_name

  - handler: AmazonBedrockHandler
    config:
      AMAZON_BEDROCK_MODEL_ID: "anthropic.claude-3-haiku-20240307-v1:0"
      AMAZON_BEDROCK_MODEL_PROPS: '{"max_tokens":4096, "anthropic_version": "bedrock-2023-05-31", "messages": [{"role": "user", "content": ""}]}'
      AMAZON_BEDROCK_PROMPT_TEMPLATE: "{prompt_text}"
      AMAZON_BEDROCK_PROMPT_INPUT_VAR: "$.messages[0].content"
      AMAZON_BEDROCK_OUTPUT_JSONPATH: "$.content[0].text"
    
  - handler: LocalFileWriterHandler
    config:
      output_key: write_file_path
inputs:
  - name: path
    type: string
    required: true
    description: Path to the input file.

  - name: write_file_path
    type: string
    required: true
    description: Path to save the summarized output.

  - name: prompt
    type: string
    required: false
    description: Optional prompt to guide the summarization.